<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 二分木（セグ木風）のアイコン -->
  <rect width="64" height="64" rx="14" fill="#4caf3c"/>
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="16" x2="19" y2="32"/>
    <line x1="32" y1="16" x2="45" y2="32"/>
    <line x1="19" y1="32" x2="12" y2="48"/>
    <line x1="19" y1="32" x2="26" y2="48"/>
    <line x1="45" y1="32" x2="38" y2="48"/>
    <line x1="45" y1="32" x2="52" y2="48"/>
  </g>
  <g fill="#ffffff">
    <circle cx="32" cy="16" r="6.5"/>
    <circle cx="19" cy="32" r="5.5"/>
    <circle cx="45" cy="32" r="5.5"/>
    <circle cx="12" cy="48" r="5"/>
    <circle cx="26" cy="48" r="5"/>
    <circle cx="38" cy="48" r="5"/>
  </g>
  <!-- 区間クエリでたどるノードを強調 -->
  <circle cx="52" cy="48" r="5" fill="#ffd33d"/>
</svg>
